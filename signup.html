<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · NoiRave</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><a class="brand" href="index.html"><span class="mark">◖</span>Noi<em>Rave</em></a><section class="card"><div class="eyebrow">JOIN THE ROOM</div><h1>Create your account</h1><p>Make a profile and share music with your community.</p><form id="form"><div class="field"><label for="name">Display name</label><input id="name" maxlength="40" autocomplete="nickname" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary" id="submit">Create account</button></form><div id="message" class="message" role="status"></div><div class="links"><span>Already a member? <a href="login.html">Sign in</a></span></div></section><a class="back" href="index.html">← Back to the room</a></main><script type="module">
import {supabase, ensureProfile} from './supabase-client.js';
const form=document.querySelector('#form'),message=document.querySelector('#message'),button=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.className='message';message.textContent='Creating your account…';const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const {data,error}=await supabase.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:authRedirectTo('index.html')}});if(error){message.className='message error';message.textContent=error.message;button.disabled=false;return;}if(!data.session){message.textContent='Account created. Check your email to confirm it, then sign in. Your profile will be created when you sign in.';button.disabled=false;return;}try{const profile=await ensureProfile(data.user);localStorage.setItem('noirave_name',profile.display_name);sessionStorage.setItem('noirave_notice','Welcome to NoiRave.');window.location.replace(new URL('./index.html',window.location.href).href);}catch(err){message.className='message error';message.textContent='Account created, but profile setup failed. Run the latest schema.sql in Supabase. '+err.message;button.disabled=false;}});
</script></body></html>
