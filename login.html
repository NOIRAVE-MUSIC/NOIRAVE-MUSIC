<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · NoiRave</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><a class="brand" href="index.html"><span class="mark">◖</span>Noi<em>Rave</em></a><section class="card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to NoiRave</h1><p>Pick up where your community left off.</p><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="submit">Sign in</button></form><div id="message" class="message" role="status"></div><div class="links"><a href="forgot-password.html">Forgot password?</a><span>New? <a href="signup.html">Create account</a></span></div></section><a class="back" href="index.html">← Back to the room</a></main><script type="module">
import {supabase, ensureProfile} from './supabase-client.js';
const form=document.querySelector('#form'),message=document.querySelector('#message'),button=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.className='message';message.textContent='Signing in…';const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){message.className='message error';message.textContent=error.message;if(error.code==='email_not_confirmed'||/email not confirmed/i.test(error.message)){const resend=document.createElement('button');resend.type='button';resend.className='primary';resend.style.marginTop='12px';resend.textContent='Resend confirmation email';resend.onclick=async()=>{resend.disabled=true;resend.textContent='Sending…';const result=await supabase.auth.resend({type:'signup',email,options:{emailRedirectTo:new URL('./index.html',window.location.href).href}});if(result.error){message.textContent='Could not send confirmation: '+result.error.message;resend.disabled=false;resend.textContent='Resend confirmation email';}else{message.textContent='Confirmation email sent. Check your inbox and spam folder, then use the link before signing in.';resend.remove();}};message.append(document.createElement('br'),resend);}button.disabled=false;return;}try{const profile=await ensureProfile(data.user);localStorage.setItem('noirave_name',profile.display_name);sessionStorage.setItem('noirave_notice','You’re signed in.');window.location.replace(new URL('./index.html',window.location.href).href);}catch(err){message.className='message error';message.textContent='You are signed in, but we could not create your profile. Run the latest schema.sql in Supabase, then sign in again. '+err.message;button.disabled=false;}});
</script></body></html>
