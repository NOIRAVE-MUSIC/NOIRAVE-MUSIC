<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · NoiRave</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><a class="brand" href="index.html"><span class="mark">◖</span>Noi<em>Rave</em></a><section class="card" id="view"><div class="eyebrow">COMMUNITY PROFILE</div><div id="profile"><p>Loading profile…</p></div></section><section class="card hidden" id="resetCard"><div class="eyebrow">ACCOUNT ACCESS</div><h1>Choose a new password</h1><p>Set a new password for your NoiRave account.</p><form id="resetForm"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary" id="updatePassword">Update password</button></form><div id="resetMessage" class="message" role="status"></div></section><a class="back" href="index.html">← Back to the room</a></main><script type="module">
import {supabase} from './supabase-client.js';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),recover=params.get('action')==='reset';
if(recover){$('#view').classList.add('hidden');$('#resetCard').classList.remove('hidden');}
supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){ $('#view').classList.add('hidden');$('#resetCard').classList.remove('hidden'); }});
$('#resetForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('#updatePassword'),message=$('#resetMessage');button.disabled=true;const {error}=await supabase.auth.updateUser({password:$('#newPassword').value});if(error){message.className='message error';message.textContent=error.message;button.disabled=false;return;}message.className='message';message.textContent='Password updated. You can return to NoiRave and sign in.';button.textContent='Updated';setTimeout(()=>window.location.replace(new URL('./index.html',window.location.href).href),1200);});
const {data:{user}}=await supabase.auth.getUser();let uid=params.get('id')||user?.id;
if(!uid){$('#profile').innerHTML='<h1>Profile</h1><p>Sign in to view your profile.</p><a href="login.html">Sign in</a>';}
else{const {data:profile,error}=await supabase.from('profiles').select('user_id,display_name,bio,favorite_genres,is_verified,avatar_url,custom_status,profile_note').eq('user_id',uid).maybeSingle();if(error){$('#profile').textContent=error.message;}else if(!profile){$('#profile').innerHTML='<h1>Profile not found</h1><p>This member has not set up a profile yet.</p>';}else{const own=user?.id===uid;$('#profile').innerHTML=`<div class="profilehead"><div class="avatar">${profile.avatar_url?`<img src="${escapeHtml(profile.avatar_url)}" alt="">`:escapeHtml((profile.display_name||'N').slice(0,1))}</div><div><h1>${escapeHtml(profile.display_name)}</h1><div class="customstatus">${escapeHtml(profile.custom_status||'')}</div><div class="genre">${profile.is_verified ? "✓ Verified Profile · " : ""}${escapeHtml(profile.favorite_genres||'Still finding their sound')}</div></div></div>${profile.profile_note?`<div class="profilenote"><span>NOTE</span><p>${escapeHtml(profile.profile_note)}</p></div>`:''}<p class="bio"></p><div class="eyebrow">RECENT SHARES</div><div class="shares" id="shares"></div>${own?'<a href="settings.html">Edit profile settings</a>':''}`;$('#profile .bio').textContent=profile.bio||'No bio yet.';const {data:posts}=await supabase.from('posts').select('title,kind,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(5);$('#shares').innerHTML=posts?.length?posts.map(p=>`<div class="share"><span>${escapeHtml(p.title)}</span><small>${p.kind==='track'?'♫ Track':'✳ Announcement'}</small></div>`).join(''):'<div class="info">No shares yet.</div>';}}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
