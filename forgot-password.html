<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · NoiRave</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><a class="brand" href="index.html"><span class="mark">◖</span>Noi<em>Rave</em></a><section class="card"><div class="eyebrow">ACCOUNT ACCESS</div><h1>Reset your password</h1><p>Enter the email on your account and we’ll send you a secure reset link.</p><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><button class="primary" id="submit">Send reset link</button></form><div id="message" class="message" role="status"></div><div class="links"><a href="login.html">Back to sign in</a></div></section><a class="back" href="index.html">← Back to the room</a></main><script type="module">
import {supabase,authRedirectTo} from './supabase-client.js';
const form=document.querySelector('#form'),message=document.querySelector('#message'),button=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.className='message';const email=document.querySelector('#email').value.trim();const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:authRedirectTo('profile.html?action=reset')});if(error){message.className='message error';message.textContent=error.message;button.disabled=false;return;}message.textContent='If an account uses that email, a reset link is on its way.';button.textContent='Email requested';});
</script></body></html>
